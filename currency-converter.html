<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Currency Converter</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="converter-box p-4">
      <h2 class="text-center mb-4">💱 Currency Converter</h2>

      <div class="mb-3">
        <label for="amount" class="form-label">Amount</label>
        <input type="number" id="amount" class="form-control" placeholder="Enter amount" value="1">
      </div>

      <div class="row mb-3">
        <div class="col">
          <label for="from" class="form-label">From</label>
          <select id="from" class="form-select"></select>
        </div>
        <div class="col">
          <label for="to" class="form-label">To</label>
          <select id="to" class="form-select"></select>
        </div>
      </div>

      <div class="d-grid">
        <button id="convert" class="btn btn-gradient btn-lg">Convert</button>
      </div>

      <h4 class="text-center mt-4" id="result">Converted amount will appear here</h4>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
